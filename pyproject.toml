[project]
name = "instagram-automation"
version = "0.1.0"
description = "Safe, stateful Instagram Reels automation pipeline"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "sqlalchemy==2.0.43",
  "httpx==0.28.1",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

